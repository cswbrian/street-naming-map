name: Sync submission tracker

on:
  repository_dispatch:
    types: [sync-submission-tracker]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Fetch Google Sheet CSV
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_TAB: ${{ secrets.GOOGLE_SHEET_TAB }}
        run: |
          mkdir -p data/crowdsubmissions
          if [ -n "$SHEET_CSV_URL" ]; then
            curl -fsSL "$SHEET_CSV_URL" -o data/crowdsubmissions/responses.csv
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$SHEET_ID" ]; then
            node scripts/fetch-google-sheet-csv.mjs
          else
            echo "No SHEET_CSV_URL or GOOGLE_SERVICE_ACCOUNT_JSON configured — skipping fetch"
            exit 0
          fi

      - name: Update submission tracker
        run: npm run sync:submission-tracker

      - name: Commit tracker if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/master/submission-tracker.json public/data/master/recently-verified.json
          if git diff --staged --quiet; then
            echo "No tracker changes"
          else
            git commit -m "chore: sync crowd submission tracker from Google Sheet"
            git push
          fi
