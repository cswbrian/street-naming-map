  <!-- Era legend strip -->
  <g transform="translate(104, 520)">
    <rect width="48" height="8" fill="#3141D4"/>
    <rect x="56" width="48" height="8" fill="#0072C9"/>
    <rect x="112" width="48" height="8" fill="#0091B0"/>
    <rect x="168" width="48" height="8" fill="#008566"/>
    <rect x="224" width="48" height="8" fill="#6E9300"/>
    <rect x="280" width="48" height="8" fill="#C41585"/>
